services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U studio"], interval: 5s, retries: 10}
  studio:
    build: {context: .., dockerfile: deploy/Dockerfile}
    depends_on: {db: {condition: service_healthy}}
    env_file: ../.env
    environment:
      STUDIO_DATABASE_URL: postgresql+psycopg://studio:${POSTGRES_PASSWORD}@db/studio
      STUDIO_DATA_DIR: /data
    volumes: [studio_data:/data]
    ports: ["127.0.0.1:8765:8765"]
volumes:
  pgdata:
  studio_data:
